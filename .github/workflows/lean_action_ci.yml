name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Check public import coverage and dependency boundaries
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_imports.py
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail

      - name: Build public API regression suite
        run: lake build AlgebraicTests --wfail

      - name: Lint public library
        run: lake lint
