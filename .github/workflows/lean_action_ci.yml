name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          build-args: --wfail

      - name: Build public API regression suite
        run: lake build AlgebraicTests --wfail

      - name: Lint public library
        run: lake lint
